[project]
name = "nasdaq-replay-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "websockets>=14",
  "tzdata; sys_platform == 'win32'",
  "sqlalchemy>=2",
  "argon2-cffi",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
